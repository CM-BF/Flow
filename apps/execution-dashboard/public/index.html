<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark">
  <title>Flow · 项目进度</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到项目进度</a>
  <header class="topbar"><a class="brand" href="/">Flow <span>项目进度</span></a><div class="toolbar"><label for="theme">主题</label><select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select><button id="refresh" type="button">刷新状态</button></div></header>
  <main id="main" tabindex="-1">
    <section class="overview" aria-labelledby="page-title"><div><h1 id="page-title">正在读取项目进度</h1><p id="phase-note" class="muted">读取各负责人维护的记录。</p></div><div class="sync"><span id="sync-state" role="status">读取中</span><time id="sync-time"></time></div></section>
    <div id="load-error" class="notice warning" role="alert" hidden></div>
    <div class="focus-layout">
      <section class="active-section" aria-labelledby="active-title"><h2 id="active-title">正在推进</h2><div id="active-work"></div><details id="other-activity" class="other-activity" hidden><summary>其他活动任务 <span id="other-activity-count" class="count"></span></summary><div id="other-activity-items"></div></details><div class="blocker-section"><h2>当前阻塞</h2><div id="blockers"></div></div></section>
      <aside><section aria-labelledby="next-title"><h2 id="next-title">下一可用交付</h2><div id="next-deliveries"></div></section><section class="decision-section" aria-labelledby="decision-title"><h2 id="decision-title">需要你决定</h2><div id="decisions"></div><p id="decision-note" class="muted small"></p></section></aside>
    </div>
    <details class="disclosure" id="unknown-section"><summary>摘要待补与来源待同步 <span id="unknown-count" class="count">0</span></summary><p class="muted small">这些是信息缺口，不自动代表阻塞或需要你决定。原始记录仍可查看。</p><div id="unknown-items"></div></details>
    <details class="disclosure" id="history-section"><summary>已完成历史 <span id="history-count" class="count">0</span><span class="summary-note">含 M1，默认收起</span></summary><div id="history-items"></div></details>
    <details class="disclosure" id="all-plans"><summary>全部计划与证据 <span id="source-count" class="count">0</span></summary><div class="section-heading"><p class="muted small">完成、审查与集成分别核对。</p><label class="filter-label">显示<select id="filter" aria-label="显示计划"><option value="all">全部计划</option><option value="in_progress">进行中</option><option value="unknown">摘要待补</option></select></label></div><div id="workstreams"></div><p id="empty-filter" class="empty-state" hidden>当前筛选下没有计划。</p></details>
    <footer><span>只读进度，每 20 秒同步</span><details><summary>查看同步依据</summary><p id="main-observation"></p><p>各任务 status.md 是唯一手填事实源。未知不算通过，文档变化与实现变化分别核对。</p><a href="/api/snapshot" target="_blank" rel="noopener">生成的 JSON</a></details></footer>
  </main>
  <dialog id="task-dialog" aria-labelledby="detail-title"><div class="dialog-top"><div><span id="detail-id" class="muted"></span><h2 id="detail-title"></h2></div><button id="close-dialog" type="button" aria-label="关闭任务详情">关闭</button></div><div id="detail-content"></div><section id="document-view" hidden><h3 id="document-title"></h3><p id="document-error" class="notice warning" hidden></p><pre id="document-text" tabindex="0"></pre><img id="document-image" alt="任务证据截图" hidden></section></dialog>
</body></html>
